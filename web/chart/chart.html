<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chart Engine</title>
  <script src="lightweight-charts.standalone.production.js"></script>
  <script>
    // Surfaces JS errors to Flutter immediately, before anything else runs —
    // so a failure (like the library not loading) shows up in your Flutter
    // debug console instead of just rendering a blank chart with no clue why.
    function reportToFlutter(name, payload) {
      if (window.onChartEvent) window.onChartEvent(name, payload);
      else if (window.FlutterBridge) window.FlutterBridge.postMessage(JSON.stringify({ event: name, payload }));
      else console.error(name, payload); // fallback if bridge isn't wired yet
    }
    window.addEventListener('error', (e) => {
      reportToFlutter('jsError', { message: e.message, source: e.filename, line: e.lineno });
    });
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof LightweightCharts === 'undefined') {
        reportToFlutter('jsError', { message: 'LightweightCharts library failed to load — check that lightweight-charts.standalone.production.js is bundled alongside chart.html.' });
      }
    });
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #131722; overflow: hidden; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }

    #root { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }

    /* ---------- Top toolbar ---------- */
    #topbar {
      height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 4px;
      background: #1e222d; border-bottom: 1px solid #2a2e39; padding: 0 8px; overflow-x: auto;
    }
    .tb-btn {
      background: transparent; border: none; color: #b2b5be; font-size: 12px; padding: 6px 10px;
      border-radius: 4px; cursor: pointer; white-space: nowrap; user-select: none;
    }
    .tb-btn:hover { background: #2a2e39; color: #d1d4dc; }
    .tb-btn.active { background: #2962ff33; color: #5b9cf6; }
    .tb-sep { width: 1px; height: 20px; background: #2a2e39; margin: 0 4px; flex-shrink: 0; }

    /* ---------- Main area: left tool rail + chart ---------- */
    #main { flex: 1; display: flex; min-height: 0; }

    #toolrail {
      width: 40px; flex-shrink: 0; background: #1e222d; border-right: 1px solid #2a2e39;
      display: flex; flex-direction: column; align-items: center; padding-top: 8px; gap: 2px;
    }
    .tool-btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; border-radius: 4px; cursor: pointer; color: #b2b5be; font-size: 15px;
    }
    .tool-btn:hover { background: #2a2e39; }
    .tool-btn.active { background: #2962ff33; color: #5b9cf6; }

    #chartwrap { position: relative; flex: 1; min-width: 0; }
    #chart { position: absolute; inset: 0; }
    #overlay { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    #overlay.drawing { pointer-events: auto; cursor: crosshair; }

    /* ---------- OHLC readout ---------- */
    #ohlc {
      position: absolute; top: 6px; left: 8px; z-index: 6; font-size: 12px; color: #d1d4dc;
      display: flex; gap: 10px; pointer-events: none; text-shadow: 0 0 3px #131722;
    }
    #ohlc span b { font-weight: 600; }
    .up { color: #26a69a; } .down { color: #ef5350; }

    /* ---------- Bottom range tabs ---------- */
    #bottombar {
      height: 30px; flex-shrink: 0; display: flex; align-items: center; gap: 2px;
      background: #1e222d; border-top: 1px solid #2a2e39; padding: 0 8px;
    }
    .rng-btn { background: transparent; border: none; color: #868993; font-size: 11px; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
    .rng-btn:hover, .rng-btn.active { color: #d1d4dc; background: #2a2e39; }
  </style>
</head>
<body>
<div id="root">

  <div id="topbar">
    <button class="tb-btn active" data-tf="1">1m</button>
    <button class="tb-btn" data-tf="5">5m</button>
    <button class="tb-btn" data-tf="15">15m</button>
    <button class="tb-btn" data-tf="60">1H</button>
    <button class="tb-btn" data-tf="D">1D</button>
    <div class="tb-sep"></div>
    <button class="tb-btn active" data-series="candle">Candles</button>
    <button class="tb-btn" data-series="line">Line</button>
    <button class="tb-btn" data-series="area">Area</button>
    <button class="tb-btn" data-series="bar">Bars</button>
  </div>

  <div id="main">
    <div id="toolrail">
      <button class="tool-btn active" data-tool="cursor" title="Cursor">&#9679;</button>
      <button class="tool-btn" data-tool="trendline" title="Trend Line">&#9585;</button>
      <button class="tool-btn" data-tool="hline" title="Horizontal Line">&#8213;</button>
      <button class="tool-btn" data-tool="rect" title="Rectangle">&#9634;</button>
      <button class="tool-btn" data-tool="text" title="Text">T</button>
      <button class="tool-btn" id="clearBtn" title="Clear all drawings">&#128465;</button>
    </div>

    <div id="chartwrap">
      <div id="chart"></div>
      <canvas id="overlay"></canvas>
      <div id="ohlc"></div>
    </div>
  </div>

  <div id="bottombar">
    <button class="rng-btn">1D</button>
    <button class="rng-btn">5D</button>
    <button class="rng-btn">1M</button>
    <button class="rng-btn">3M</button>
    <button class="rng-btn">6M</button>
    <button class="rng-btn">YTD</button>
    <button class="rng-btn active">1Y</button>
    <button class="rng-btn">5Y</button>
    <button class="rng-btn">All</button>
  </div>

</div>

<script>
  /* ============================================================
     CHART ENGINE
     - Lightweight Charts for candles/volume/line/area/bar series
     - Custom canvas overlay for drawing tools (trendline, hline, rect, text)
     - window.ChartBridge exposes the API Flutter calls into
     - window.onChartEvent(name, payload) is called OUT to Flutter (wired per-platform)
     ============================================================ */

  const chartEl = document.getElementById('chart');
  const overlay = document.getElementById('overlay');
  const octx = overlay.getContext('2d');
  const ohlcEl = document.getElementById('ohlc');

  const chart = LightweightCharts.createChart(chartEl, {
    layout: { background: { color: '#131722' }, textColor: '#b2b5be' },
    grid: {
      vertLines: { color: '#202431' },
      horzLines: { color: '#202431' },
    },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#2a2e39' },
    timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
  });

  let mainSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });

  const volumeSeries = chart.addHistogramSeries({
    priceFormat: { type: 'volume' },
    priceScaleId: 'volume',
  });
  chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.05, bottom: 0.2 } });

  let candles = [];   // {time, open, high, low, close, volume}
  let currentSeriesType = 'candle';
  let drawings = [];      // {type, points:[{time,price}], text}
  let draftPoints = [];   // points being placed for the current drawing

  function resize() {
    const r = chartEl.getBoundingClientRect();
    chart.applyOptions({ width: r.width, height: r.height });
    overlay.width = r.width; overlay.height = r.height;
    redrawDrawings();
  }
  new ResizeObserver(resize).observe(chartEl);
  resize();

  /* ---------- Series type switching ---------- */
  function setSeriesType(type) {
    currentSeriesType = type;
    chart.removeSeries(mainSeries);
    if (type === 'candle') {
      mainSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderUpColor: '#26a69a', borderDownColor: '#ef5350',
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
      });
      mainSeries.setData(candles);
    } else if (type === 'bar') {
      mainSeries = chart.addBarSeries({ upColor: '#26a69a', downColor: '#ef5350' });
      mainSeries.setData(candles);
    } else if (type === 'line') {
      mainSeries = chart.addLineSeries({ color: '#5b9cf6', lineWidth: 2 });
      mainSeries.setData(candles.map(c => ({ time: c.time, value: c.close })));
    } else if (type === 'area') {
      mainSeries = chart.addAreaSeries({ lineColor: '#5b9cf6', topColor: '#5b9cf655', bottomColor: '#5b9cf600' });
      mainSeries.setData(candles.map(c => ({ time: c.time, value: c.close })));
    }
  }

  document.querySelectorAll('[data-series]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-series]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      setSeriesType(btn.dataset.series);
    });
  });

  document.querySelectorAll('[data-tf]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tf]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      emitEvent('timeframeChanged', { tf: btn.dataset.tf });
    });
  });

  /* ---------- OHLC crosshair readout ---------- */
  chart.subscribeCrosshairMove(param => {
    if (!param.time || !param.seriesData.size) { ohlcEl.innerHTML = ''; return; }
    const d = param.seriesData.get(mainSeries);
    if (!d) return;
    if (d.open !== undefined) {
      const dir = d.close >= d.open ? 'up' : 'down';
      ohlcEl.innerHTML =
        `<span>O <b class="${dir}">${d.open.toFixed(2)}</b></span>` +
        `<span>H <b class="${dir}">${d.high.toFixed(2)}</b></span>` +
        `<span>L <b class="${dir}">${d.low.toFixed(2)}</b></span>` +
        `<span>C <b class="${dir}">${d.close.toFixed(2)}</b></span>`;
    } else if (d.value !== undefined) {
      ohlcEl.innerHTML = `<span>Value <b>${d.value.toFixed(2)}</b></span>`;
    }
  });

  /* ============================================================
     DRAWING TOOLS (custom overlay canvas)
     ============================================================ */
  let activeTool = 'cursor';

  document.querySelectorAll('[data-tool]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTool = btn.dataset.tool;
      draftPoints = [];
      overlay.classList.toggle('drawing', activeTool !== 'cursor');
    });
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    drawings = [];
    redrawDrawings();
    emitEvent('drawingsCleared', {});
  });

  function pxToTimePrice(x, y) {
    const time = chart.timeScale().coordinateToTime(x);
    const price = mainSeries.coordinateToPrice(y);
    return { time, price };
  }
  function timePriceToPx(time, price) {
    const x = chart.timeScale().timeToCoordinate(time);
    const y = mainSeries.priceToCoordinate(price);
    return { x, y };
  }

  overlay.addEventListener('click', (e) => {
    if (activeTool === 'cursor') return;
    const rect = overlay.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const tp = pxToTimePrice(x, y);
    if (tp.time == null || tp.price == null) return;

    if (activeTool === 'hline') {
      drawings.push({ type: 'hline', points: [tp] });
      redrawDrawings();
      notifyDrawingAdded(drawings[drawings.length - 1]);
      return;
    }
    if (activeTool === 'text') {
      const label = prompt('Label text:', '');
      if (label) {
        drawings.push({ type: 'text', points: [tp], text: label });
        redrawDrawings();
        notifyDrawingAdded(drawings[drawings.length - 1]);
      }
      return;
    }
    // trendline / rect need two points
    draftPoints.push(tp);
    if (draftPoints.length === 2) {
      drawings.push({ type: activeTool, points: [...draftPoints] });
      draftPoints = [];
      redrawDrawings();
      notifyDrawingAdded(drawings[drawings.length - 1]);
    }
  });

  // Fires an event out to whichever host is listening — web (HtmlElementView,
  // via window.onChartEvent injected by chart_view_web.dart) or mobile
  // (webview_flutter JavaScriptChannel named 'FlutterBridge').
  function emitEvent(name, payload) {
    reportToFlutter(name, payload);
  }

  function notifyDrawingAdded(d) {
    emitEvent('drawingAdded', d);
  }

  function redrawDrawings() {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    octx.strokeStyle = '#5b9cf6';
    octx.fillStyle = '#5b9cf6';
    octx.lineWidth = 1.5;
    octx.font = '12px sans-serif';

    drawings.forEach(d => {
      if (d.type === 'hline') {
        const p = timePriceToPx(d.points[0].time, d.points[0].price);
        if (p.y == null) return;
        octx.beginPath();
        octx.setLineDash([4, 3]);
        octx.moveTo(0, p.y); octx.lineTo(overlay.width, p.y);
        octx.stroke();
        octx.setLineDash([]);
      } else if (d.type === 'trendline') {
        const a = timePriceToPx(d.points[0].time, d.points[0].price);
        const b = timePriceToPx(d.points[1].time, d.points[1].price);
        if (a.x == null || b.x == null) return;
        octx.beginPath();
        octx.moveTo(a.x, a.y); octx.lineTo(b.x, b.y);
        octx.stroke();
      } else if (d.type === 'rect') {
        const a = timePriceToPx(d.points[0].time, d.points[0].price);
        const b = timePriceToPx(d.points[1].time, d.points[1].price);
        if (a.x == null || b.x == null) return;
        octx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
        octx.fillStyle = '#5b9cf615';
        octx.fillRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
        octx.fillStyle = '#5b9cf6';
      } else if (d.type === 'text') {
        const p = timePriceToPx(d.points[0].time, d.points[0].price);
        if (p.x == null) return;
        octx.fillText(d.text, p.x + 4, p.y - 4);
      }
    });
  }
  chart.timeScale().subscribeVisibleTimeRangeChange(redrawDrawings);
  chart.subscribeCrosshairMove(redrawDrawings);

  /* ============================================================
     PATTERN LABEL OVERLAY (for the "39 patterns" auto-detection feature —
     Flutter/backend does the detection, this just renders the markers)
     ============================================================ */
  function setPatternMarkers(markers) {
    // markers: [{time, position: 'aboveBar'|'belowBar', color, shape, text}]
    mainSeries.setMarkers(markers);
  }

  /* ============================================================
     BRIDGE — this is what Flutter calls into
     ============================================================ */
  window.ChartBridge = {
    setData(candlesJson) {
      try {
        candles = JSON.parse(candlesJson);
        if (currentSeriesType === 'candle' || currentSeriesType === 'bar') {
          mainSeries.setData(candles);
        } else {
          mainSeries.setData(candles.map(c => ({ time: c.time, value: c.close })));
        }
        volumeSeries.setData(candles.map(c => ({
          time: c.time, value: c.volume || 0,
          color: c.close >= c.open ? '#26a69a55' : '#ef535055',
        })));
        chart.timeScale().fitContent();
      } catch (err) {
        reportToFlutter('jsError', { message: 'setData failed: ' + err.message });
      }
    },
    addOrUpdateBar(barJson) {
      try {
        const bar = JSON.parse(barJson);
        const last = candles[candles.length - 1];
        if (last && last.time === bar.time) candles[candles.length - 1] = bar;
        else candles.push(bar);
        if (currentSeriesType === 'candle' || currentSeriesType === 'bar') {
          mainSeries.update(bar);
        } else {
          mainSeries.update({ time: bar.time, value: bar.close });
        }
        volumeSeries.update({ time: bar.time, value: bar.volume || 0, color: bar.close >= bar.open ? '#26a69a55' : '#ef535055' });
      } catch (err) {
        reportToFlutter('jsError', { message: 'addOrUpdateBar failed: ' + err.message });
      }
    },
    setPatternMarkers(markersJson) {
      try {
        setPatternMarkers(JSON.parse(markersJson));
      } catch (err) {
        reportToFlutter('jsError', { message: 'setPatternMarkers failed: ' + err.message });
      }
    },
    setTheme(bg, text) {
      chart.applyOptions({ layout: { background: { color: bg }, textColor: text } });
    },
  };

  /* ---------- Mock data so this file is testable standalone in a browser ---------- */
  (function seedMockData() {
    const now = Math.floor(Date.now() / 1000);
    let price = 64000;
    const mock = [];
    for (let i = 200; i >= 0; i--) {
      const t = now - i * 60;
      const open = price;
      const change = (Math.random() - 0.5) * 40;
      const close = open + change;
      const high = Math.max(open, close) + Math.random() * 15;
      const low = Math.min(open, close) - Math.random() * 15;
      price = close;
      mock.push({ time: t, open, high, low, close, volume: Math.random() * 2 });
    }
    window.ChartBridge.setData(JSON.stringify(mock));
  })();
</script>
</body>
</html>
