name: chart_engine
description: Standalone, reusable chart engine built on Lightweight Charts. Renders OHLCV data, drawing tools, indicators, and patterns — the host app feeds data, the engine handles all rendering.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  web: ^1.1.1

flutter:
  assets:
    - assets/chart/chart.html
    - assets/chart/chart_mobile.html
    - assets/chart/lightweight-charts.standalone.production.js
    - assets/chart/js/core/
    - assets/chart/js/drawings/
    - assets/chart/js/drawings/tools/
    - assets/chart/js/indicators/
    - assets/chart/js/indicators/calc/
    - assets/chart/js/settings/
